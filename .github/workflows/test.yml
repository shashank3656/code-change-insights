name: Test change intelligence

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests -v

  action-smoke:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Empty release must stop before any API call
        uses: ./
        id: smoke
        continue-on-error: true
        with:
          operation: change-request
          default-branch: ${{ github.event.repository.default_branch }}
          base-sha: ${{ github.sha }}
          target-sha: ${{ github.sha }}
          service: test-fixture
          environment: test
          title: Empty release smoke test
      - name: Verify fail-closed result
        env:
          RESULT: ${{ steps.smoke.outcome }}
          REPORTS: ${{ steps.smoke.outputs.artifact-directory }}
        run: |
          test "$RESULT" = failure
          test -d "$REPORTS"
          test ! -f "$REPORTS/change-request.json"
