# Copy to .github/workflows/ingest-changes.yml in each application repository.
name: Ingest application changes

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full before SHA (40 zeros only for initial history backfill)
        required: true
        type: string
      target_sha:
        description: Full target SHA already merged into main
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: insights-ingest-${{ github.event.after || inputs.target_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  ingest:
    if: github.ref == 'refs/heads/main' && github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: shashank3656/code-change-insights@v1
        id: insights
        with:
          operation: ingest
          base-sha: ${{ inputs.base_sha }}
          target-sha: ${{ inputs.target_sha }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openai-model: ${{ vars.OPENAI_MODEL }}
      - name: Keep ingestion report
        if: always() && steps.insights.outputs.artifact-directory != ''
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.insights.outputs.artifact-directory }}
          if-no-files-found: ignore
          retention-days: 30
